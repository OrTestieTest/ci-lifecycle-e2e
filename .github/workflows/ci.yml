name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-mirror:
    name: dependency-mirror
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Verify dependency mirror
        run: python3 scripts/check_dependency_mirror.py

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  infra-gate:
    name: infra-gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Enforce infrastructure gate
        run: |
          base=$(git merge-base HEAD origin/main)
          if git log --name-only --pretty=format: "$base..HEAD" | grep -qx '.ci/infra-gate.fail'; then
            echo "infra-gate: this branch touches the deployment gate, so the deployment target is unavailable" >&2
            echo "The gate is owned by the platform team and cannot be cleared from this repository." >&2
            exit 1
          fi
          echo "infra-gate: deployment target available"
