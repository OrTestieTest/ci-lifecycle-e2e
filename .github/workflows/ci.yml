name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dependency-mirror:
    name: dependency-mirror
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Hold check open for verification
        run: sleep 180
      - name: Verify dependency mirror
        run: python3 scripts/check_dependency_mirror.py
